[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# numba's compiled code has its own np.random (seeded per call); it doesn't take Generator objects
"optlab/exotics.py" = ["NPY002"]
"optlab/local_vol.py" = ["NPY002"]  # numba kernels only support the legacy np.random API
