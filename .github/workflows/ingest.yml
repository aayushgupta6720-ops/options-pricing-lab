name: Daily NSE ingest

# Adds each trading day's NSE option data to the dataset on the market-data branch, which the
# app reads. NSE publishes the F&O bhavcopy in the evening IST, and each run looks back over the
# last 10 days, so a day that was late or failed is picked up by the next run. Holidays have no
# file and are skipped. If a day fails (NSE blocking us, a bad file), the days that worked are
# still saved, and the run is marked failed at the end.

on:
  schedule:
    - cron: "47 14 * * 1-5" # 20:17 IST, weekdays
  workflow_dispatch:
    inputs:
      since:
        description: Ingest every trading day from this date (YYYY-MM-DD) instead of the last 10 days
        required: false
      date:
        description: Ingest just this date (YYYY-MM-DD)
        required: false
      force:
        description: Redo days already in the dataset
        type: boolean
        default: false

permissions:
  contents: write # push to market-data

# One run at a time, so two never push to market-data at once.
concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # a full backfill (`since` 2024-07-01) takes about an hour
    steps:
      - uses: actions/checkout@v7

      - name: Check out the dataset
        uses: actions/checkout@v7
        with:
          ref: market-data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt

      - name: Ingest
        id: ingest
        continue-on-error: true # save what worked; the last step fails the run
        run: python -m scripts.ingest --data-dir data ${SINCE:+--since "$SINCE"} ${DAY:+--date "$DAY"} ${FORCE:+--force}
        env:
          SINCE: ${{ inputs.since }}
          DAY: ${{ inputs.date }}
          FORCE: ${{ inputs.force && '1' || '' }}

      # Model fits for any day that doesn't have them yet: Heston and SABR (a second a day), rough
      # Bergomi for NIFTY (about ten seconds a day).
      - name: Calibrate
        id: calibrate
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m scripts.calibrate --data-dir data --workers 2

      - name: Save
        if: ${{ !cancelled() }}
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Ingest $(date -u +%Y-%m-%d)"
          git push

      - name: Fail the run if any day failed
        if: steps.ingest.outcome == 'failure' || steps.calibrate.outcome == 'failure'
        run: |
          echo "Some days failed to ingest or calibrate; see those steps. The rest were saved."
          exit 1
